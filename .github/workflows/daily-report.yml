name: Reporte diario por correo

on:
  schedule:
    # 22:00 UTC = 6:00 pm en Venezuela (America/Caracas, UTC-4, sin horario de verano).
    # Si cambias de zona horaria, ajusta esta hora y REPORT_TZ.
    - cron: '0 22 * * *'
  workflow_dispatch: # Para enviarlo a mano desde la pestaña "Actions"
    inputs:
      date:
        description: 'Día a reportar (AAAA-MM-DD). Vacío = hoy'
        required: false

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Generar y enviar reporte
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          REPORT_EXTRA_TO: ${{ vars.REPORT_EXTRA_TO }}
          REPORT_SKIP_EMPTY: ${{ vars.REPORT_SKIP_EMPTY }}
          APP_URL: ${{ vars.APP_URL }}
          REPORT_TZ: America/Caracas
          REPORT_DATE: ${{ inputs.date }}
        run: |
          for s in FIREBASE_SERVICE_ACCOUNT SMTP_HOST SMTP_USER SMTP_PASS; do
            if [ -z "${!s}" ]; then echo "::error::Falta el secreto $s (Settings → Secrets and variables → Actions)."; exit 1; fi
          done
          node scripts/daily-report.mjs
